<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ace Materials Tracker</title>
<meta name="description" content="Ace Fire LA materials spending by job - admin and staff views.">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14181d; --muted: #47515d; --line: #dde2e8; --chip: #eceff3;
    --accent: #c8102e; --accent-ink: #ffffff;
    --red: #b91c1c; --red-bg: #fde8e8; --amber: #8a4b00; --amber-bg: #fdf0d5; --amber-bar: #d97706;
    --neutral: #374151; --neutral-bg: #eceff3; --blue: #0b4f7a; --blue-bg: #e3f1fb; --bar: #4b5563; --credit-bar: #2b7bb9;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --ink: #e8ecf1; --muted: #b6c0cb; --line: #2c333c; --chip: #232a33;
    --red: #fca5a5; --red-bg: #3a1618; --amber: #fcd34d; --amber-bg: #3a2a0c; --neutral: #d1d8e0; --neutral-bg: #262d36;
    --blue: #93c5fd; --blue-bg: #13283a; --bar: #9aa5b1; --credit-bar: #5aa2d6;
  } }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --ink: #e8ecf1; --muted: #b6c0cb; --line: #2c333c; --chip: #232a33;
    --red: #fca5a5; --red-bg: #3a1618; --amber: #fcd34d; --amber-bg: #3a2a0c; --neutral: #d1d8e0; --neutral-bg: #262d36;
    --blue: #93c5fd; --blue-bg: #13283a; --bar: #9aa5b1; --credit-bar: #5aa2d6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-wrap: anywhere; }
  header { background: var(--card); border-bottom: 3px solid var(--accent); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; }
  header .sp { flex: 1; }
  .badge { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 15px; color: var(--muted); }
  .badge.admin { background: var(--red-bg); color: var(--red); font-weight: 600; }
  nav.topnav { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; overflow-x: auto; }
  nav.topnav .in { max-width: 1120px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
  nav.topnav button { border: 0; border-radius: 0; background: transparent; padding: 12px 12px 9px; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--muted); font-weight: 600; flex-shrink: 0; }
  nav.topnav button.on { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 1120px; margin: 0 auto; padding: 16px; }
  .pagehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
  .pagehead h2 { font-size: 24px; margin: 0; }
  .pagehead .sp { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
  .card h3 { font-size: 19px; margin: 0 0 10px; }
  .card h4 { font-size: 17px; margin: 14px 0 6px; }
  .grid { display: grid; gap: 16px; margin-bottom: 16px; }
  .grid > .card { margin-bottom: 0; display: flex; flex-direction: column; }
  .grid > .card .foot { margin-top: auto; padding-top: 10px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 960px) { .g3 { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .g2 { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }
  .note { color: var(--muted); font-size: 15px; margin: 10px 0 0; }
  a { color: var(--accent); }
  input, select, button, textarea { font: inherit; color: inherit; background: var(--card); border: 1px solid #9aa4b0; border-radius: 8px; padding: 8px 10px; min-width: 0; }
  button { cursor: pointer; border-color: var(--line); background: var(--chip); font-weight: 600; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.ghost { background: transparent; border-color: #9aa4b0; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  a.btn { display: inline-block; border: 1px solid #9aa4b0; border-radius: 8px; padding: 6px 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button, .acts a.btn { font-size: 15px; padding: 6px 10px; }
  label { font-size: 15px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 600; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .form .full { grid-column: 1 / -1; }
  .form input, .form select, .form textarea { width: 100%; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; }
  .filters input, .filters select { width: 100%; }
  .filters .wide { grid-column: span 2; }
  @media (max-width: 520px) { .filters .wide { grid-column: auto; } }
  .err { color: var(--red); font-size: 15px; min-height: 1em; }
  .ok-msg { color: var(--ink); font-size: 15px; }
  .login { max-width: 420px; margin: 50px auto; }
  /* status labels: color + words, always */
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .st-urgent { background: var(--red-bg); color: var(--red); }
  .st-review { background: var(--amber-bg); color: var(--amber); }
  .st-info, .st-ok { background: var(--neutral-bg); color: var(--neutral); }
  .st-credit { background: var(--blue-bg); color: var(--blue); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 14px; background: var(--chip); color: var(--muted); font-weight: 600; }
  /* attention list */
  ul.att { list-style: none; margin: 0; padding: 0; }
  ul.att li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0 12px 12px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--line); margin-bottom: 6px; }
  ul.att li:last-child { border-bottom: 0; }
  ul.att li.lv-urgent { border-left-color: var(--red); }
  ul.att li.lv-review { border-left-color: var(--amber-bar); }
  ul.att .t { font-weight: 700; font-size: 18px; }
  ul.att .s { color: var(--muted); font-size: 15px; }
  ul.att .main { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  ul.att .main > div { min-width: 0; }
  ul.att .main .status { flex-shrink: 0; }
  ul.att button { white-space: nowrap; flex-shrink: 0; }
  @media (max-width: 600px) { ul.att li { flex-direction: column; align-items: stretch; } ul.att button { align-self: flex-start; } ul.att .main { flex-direction: column; gap: 4px; } }
  /* key/value lines */
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  .kv .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .kv .total { border-top: 1px solid var(--line); padding-top: 6px; }
  .big { font-size: 26px; font-weight: 800; }
  .explain { background: var(--blue-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 16px; }
  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wrap { overflow-x: auto; }
  tr.detail > td { background: var(--bg); }
  tr.sel > td { background: var(--chip); }
  .sub { display: block; color: var(--muted); font-size: 15px; }
  .addr { font-weight: 700; }
  .bar { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; min-width: 90px; margin: 4px 0; }
  .bar i { display: block; height: 100%; background: var(--bar); }
  .bar.review i { background: var(--amber-bar); } .bar.urgent i { background: var(--red); }
  table.mini { font-size: 15px; }
  table.mini th, table.mini td { padding: 6px; }
  @media (max-width: 700px) {
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
    table.stack thead { display: none; }
    table.stack > tbody > tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; padding: 6px 12px; background: var(--card); }
    table.stack > tbody > tr.detail { margin-top: -12px; border-top: 0; border-radius: 0 0 10px 10px; background: var(--bg); }
    table.stack > tbody > tr > td { border: 0; padding: 5px 0; text-align: left; white-space: normal; }
    table.stack > tbody > tr > td[data-label]::before { content: attr(data-label); display: block; font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
    table.stack > tbody > tr.detail > td { background: transparent; }
    table.stack > tbody > tr > td[data-label=""]::before { display: none; }
    .tablecard { background: transparent; border: 0; padding: 0; }
    header h1 { font-size: 18px; }
    .pagehead h2 { font-size: 22px; }
  }
  /* monthly chart (horizontal bars, net per month) */
  .mrows { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; }
  .mrows .m { white-space: nowrap; font-size: 15px; }
  .mrows .b { height: 14px; background: var(--chip); border-radius: 4px; overflow: hidden; }
  .mrows .b i { display: block; height: 100%; background: var(--bar); }
  .mrows .b i.cr { background: var(--credit-bar); }
  .mrows .n { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
  .mrows .x { grid-column: 2 / 4; margin-top: -6px; font-size: 14px; color: var(--muted); }
  @media (max-width: 420px) { .mrows .m { font-size: 14px; } }
  /* searchable job selector */
  .combo { position: relative; }
  .combo input { width: 100%; }
  .combo-list { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin-top: 2px; background: var(--card); border: 1px solid #9aa4b0; border-radius: 8px; max-height: 300px; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .combo-opt { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; font-weight: 400; }
  .combo-opt:hover, .combo-opt:focus { background: var(--chip); outline: none; }
  .combo-opt b { display: block; }
  .combo-opt span { display: block; font-size: 14px; color: var(--muted); }
  .combo-more { padding: 8px 10px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; font-weight: 600; }
  .panel { border: 2px solid var(--accent); }
  .dupg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .dupg ul { margin: 6px 0 0; padding-left: 18px; }
  .dupg li { margin: 4px 0; }
  .mt { margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Ace Fire LA &middot; Materials Tracker</h1>
  <span class="sp"></span>
  <span id="who" class="badge" hidden></span>
  <button id="refresh" class="ghost" hidden title="Reload data">Refresh</button>
  <button id="logout" class="ghost" hidden>Sign out</button>
</header>
<nav id="nav" class="topnav" hidden aria-label="Pages"></nav>
<main id="app"></main>

<script>
// Apps Script web app URL (set after the first deployment; see README).
const API_URL = "https://script.google.com/macros/s/AKfycbzAnJsbq-E3UAhiLc3Xg_Wo0FMFXUo3N-erkOycUmMR_M5iG9rW0QWCROO0REDewzt5/exec";

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (n === "" || n == null || isNaN(Number(n))) ? "" : Number(n).toLocaleString("en-US", { style: "currency", currency: "USD" });
const money3 = (n) => (n === "" || n == null || isNaN(Number(n))) ? "" : "$" + Number(n).toFixed(3);
const ym = (d) => String(d || "").slice(0, 7);
const todayPT = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
const isLow = (i) => i.min_level !== "" && i.min_level != null && i.qty_on_hand !== "" && i.qty_on_hand != null && Number(i.qty_on_hand) <= Number(i.min_level);
const state = { role: null, name: "", passcode: "", data: null, D: null, tab: "overview", job: "", jshow: "", sec: "", panel: "", limit: 60, filters: { q: "", job: "", supplier: "", month: "", show: "" }, pq: "", pshow: "", iq: "", ishow: "" };

// ---------- formatting ----------
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTH = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function fmtDate(d) {
  const s = String(d || "").trim();
  if (!s) return "";
  if (s.includes("T")) { const t = new Date(s); if (!isNaN(t)) return t.toLocaleDateString("en-US", { timeZone: "America/Los_Angeles", month: "short", day: "numeric", year: "numeric" }); }
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${MON[Number(m[2]) - 1]} ${Number(m[3])}, ${m[1]}` : s;
}
const fmtMonth = (k) => { const m = String(k || "").match(/^(\d{4})-(\d{2})/); return m ? `${MONTH[Number(m[2]) - 1]} ${m[1]}` : String(k || ""); };
const fmtMon = (k) => { const m = String(k || "").match(/^(\d{4})-(\d{2})/); return m ? `${MON[Number(m[2]) - 1]} ${m[1]}` : String(k || ""); };
const plural = (n, one, many) => `${Number(n).toLocaleString("en-US")} ${n === 1 ? one : (many || one + "s")}`;
const daysAgo = (n) => { const t = new Date(todayPT() + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0, 10); };
const lvWord = { urgent: "Urgent", review: "Needs review", info: "For info", ok: "OK" };

// ---------- purchase rules (same as weekly-summary.mjs) ----------
const STOCK_PO = /^(SHOP|STOCK|TRUCK STOCK|SHOP STOCK|PAULA|TESTING)$/i;
const hasJob = (p) => String(p.job || "").trim() !== "";
const isQBOnly = (p) => p.source === "QuickBooks card charge";
const isStockPO = (p) => STOCK_PO.test(String(p.po_ref || "").trim());
const needsJob = (p) => !hasJob(p) && !isQBOnly(p) && !isStockPO(p);
const isReturn = (p) => p.type === "credit" || Number(p.total) < 0;
const isCounted = (i) => String(i.last_counted || "").trim() !== "";

async function api(payload) {
  let text;
  try {
    const res = await fetch(API_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...payload, passcode: state.passcode, name: state.name }) });
    text = await res.text();
  } catch { throw new Error("Could not reach the server. Check the connection and try again."); }
  let j;
  try { j = JSON.parse(text); } catch { throw new Error("The server did not answer properly. Try again."); }
  if (!j.ok) throw new Error(j.error || "request failed");
  return j;
}

function renderLogin(msg = "") {
  $("#who").hidden = $("#logout").hidden = $("#refresh").hidden = $("#nav").hidden = true;
  $("#app").innerHTML = `
    <div class="card login">
      <h3>Sign in</h3>
      <p class="muted">Enter the passcode you were given and your name. Your name is recorded on anything you add.</p>
      <form id="lf">
        <label for="nm">Your name</label><input id="nm" required autocomplete="name" value="${esc(localStorage.getItem("mt_name") || "")}" style="width:100%">
        <label for="pc" style="margin-top:10px">Passcode</label><input id="pc" type="password" required autocomplete="off" style="width:100%">
        <div class="err" id="le">${esc(msg)}</div>
        <button class="primary" style="width:100%;margin-top:6px">Open tracker</button>
      </form>
    </div>`;
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    state.name = $("#nm").value.trim(); state.passcode = $("#pc").value.trim();
    $("#le").textContent = "Checking...";
    try {
      const r = await api({ action: "login" });
      state.role = r.role;
      try { localStorage.setItem("mt_name", state.name); sessionStorage.setItem("mt_pc", state.passcode); } catch {}
      await load();
    } catch (err) { $("#le").textContent = err.message === "bad_passcode" ? "That passcode is not right." : "Could not sign in: " + err.message; }
  };
}

async function load() {
  if (!state.data) $("#app").innerHTML = `<p class="muted">Loading...</p>`;
  let r;
  try { r = await api({ action: "list" }); }
  catch (err) {
    if (err.message === "bad_passcode") { state.data = null; renderLogin("That passcode is not right. Please sign in again."); return; }
    if (state.data) {
      render();
      $("#app").insertAdjacentHTML("afterbegin", `<p class="err">Could not refresh: ${esc(err.message)} <button id="retry" class="ghost">Retry</button></p>`);
    } else {
      $("#app").innerHTML = `<div class="card"><p class="err">${esc(err.message)}</p><button id="retry" class="primary">Try again</button></div>`;
    }
    $("#retry").onclick = load;
    return;
  }
  state.role = r.role; state.data = r;
  render();
}

// ---------- derived data (computed once per render) ----------
const DIRS = new Set(["N", "S", "E", "W", "NORTH", "SOUTH", "EAST", "WEST"]);
function jobKey(name) {
  const s = String(name || "").toUpperCase().replace(/[.,#]/g, " ").replace(/\s+/g, " ").trim();
  if (!s) return "";
  let m = s.match(/^Q\s*-?\s*0*(\d{1,5})$/); if (m) return "Q" + m[1];
  m = s.match(/^0*(\d{2,4})$/); if (m) return "Q" + m[1];        // a bare "326" may be Q326
  m = s.match(/^(\d{2,6})\s+(.+)$/);                              // street number + first street word (3 letters)
  if (m) { const w = m[2].split(" ").filter((x) => !DIRS.has(x)); if (w.length) return m[1] + " " + w[0].slice(0, 3); }
  return s.replace(/\s/g, "");
}

function derive() {
  const d = state.data;
  const P = d.purchases || [], J = d.jobs || [], I = d.inventory || [], PI = d.purchase_items || [], E = d.estimate_items || [];
  const H = (d.price_history || []).filter((h) => Number(h.unit_price) > 0);
  const linesBy = {}; PI.forEach((it) => { (linesBy[it.purchase_id] = linesBy[it.purchase_id] || []).push(it); });
  const countBy = {}; P.forEach((p) => { const k = String(p.job || "").trim(); if (k) countBy[k] = (countBy[k] || 0) + 1; });
  const jobRow = {}; J.forEach((j) => { const k = String(j.job || "").trim(); if (k) jobRow[k] = j; });
  const names = [...new Set([...Object.keys(jobRow), ...Object.keys(countBy)])].sort((a, b) => a.localeCompare(b));
  // months: purchases vs returns/credits vs net
  const months = {};
  P.forEach((p) => { const k = ym(p.date); if (!k) return; const s = months[k] = months[k] || { buy: 0, ret: 0, nb: 0, nr: 0 }; const t = Number(p.total || 0); if (isReturn(p)) { s.ret += t; s.nr++; } else { s.buy += t; s.nb++; } });
  const thisMonth = ym(todayPT());
  // purchases without a job
  const noJob = P.filter((p) => !hasJob(p));
  const need = P.filter(needsJob), stockPO = noJob.filter((p) => !isQBOnly(p) && isStockPO(p)), qbOnly = noJob.filter(isQBOnly);
  // inventory
  const bought = {};
  PI.forEach((it) => { const k = String(it.part_no || "").trim(); if (!k || !(Number(it.qty) > 0)) return; const b = bought[k] = bought[k] || { qty: 0, unit: it.unit, first: it.date, n: 0 }; b.qty += Number(it.qty); b.n++; if (String(it.date) < String(b.first)) b.first = it.date; });
  const inv = I.map((i) => ({ i, st: invStatus(i), b: bought[String(i.part_no || "").trim()] }));
  // prices: latest buy per supplier + part
  const latest = {};
  H.forEach((h) => { const k = h.supplier + "|" + h.part_no; if (!latest[k] || String(h.date) > String(latest[k].date)) latest[k] = h; });
  const priceRows = Object.values(latest);
  const d60 = daysAgo(60);
  const rises60 = priceRows.filter((h) => Number(h.change_pct) >= 10 && String(h.date) >= d60);
  // possible duplicate job names
  const parent = {}; const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  const byKey = {};
  names.forEach((n) => {
    parent[n] = n;
    const keys = [jobKey(n)]; if (jobRow[n] && jobRow[n].address) keys.push(jobKey(jobRow[n].address));
    keys.filter(Boolean).forEach((k) => { if (byKey[k]) parent[find(n)] = find(byKey[k]); else byKey[k] = n; });
  });
  const groups = {}; names.forEach((n) => { (groups[find(n)] = groups[find(n)] || []).push(n); });
  const dups = Object.values(groups).filter((g) => g.length > 1).map((g) => g.sort((a, b) => (countBy[b] || 0) - (countBy[a] || 0) || a.localeCompare(b)));
  return { P, J, I, PI, E, H, linesBy, countBy, jobRow, names, months, thisMonth, noJob, need, stockPO, qbOnly, inv, bought, priceRows, rises60, dups };
}

function invStatus(i) {
  if (!isCounted(i)) return { key: "notcounted", label: "Not counted", lv: "review" };
  if (i.qty_on_hand !== "" && i.qty_on_hand != null && Number(i.qty_on_hand) === 0) return { key: "zero", label: "0 on hand", lv: "urgent" };
  if (isLow(i)) return { key: "low", label: "Low stock", lv: "urgent" };
  if (i.min_level === "" || i.min_level == null) return { key: "nomin", label: "Counted, reorder level not set", lv: "info" };
  return { key: "ok", label: "In stock", lv: "ok" };
}

function budgetState(j) {
  const b = Number(j.materials_budget || 0);
  if (!b) return { key: "none", label: "Budget not set", lv: "review" };
  if (j.actual > b) return { key: "over", label: "Over budget", lv: "urgent" };
  if (j.pct >= 85) return { key: "near", label: "Near budget", lv: "review" };
  return { key: "within", label: "Within budget", lv: "ok" };
}
const remainingOf = (j) => j.variance != null && j.variance !== "" ? Number(j.variance) : Number(j.materials_budget || 0) - Number(j.actual || 0);
const st = (lv, label) => `<span class="status st-${lv}">${esc(label)}</span>`;
function jobTitle(name) {
  const j = state.D.jobRow[name];
  const addr = j && String(j.address || "").trim();
  return { main: addr || name, sub: addr && addr.toLowerCase() !== String(name).toLowerCase() && !addr.toLowerCase().startsWith(String(name).toLowerCase()) ? name : "" };
}
function budgetLine(j) {
  const r = remainingOf(j);
  return r >= 0 ? `${money(r)} remaining · ${j.pct}% of budget used` : `${money(-r)} over budget · ${j.pct}% of budget used`;
}

// ---------- navigation (hash keeps filters, so a link opens a filtered list) ----------
function hashFor() {
  const p = new URLSearchParams();
  const set = (k, v) => { if (v) p.set(k, v); };
  if (state.tab === "purchases") { const f = state.filters; set("show", f.show); set("job", f.job); set("supplier", f.supplier); set("month", f.month); set("q", f.q); }
  if (state.tab === "inventory") { set("show", state.ishow); set("q", state.iq); }
  if (state.tab === "prices") { set("show", state.pshow); set("q", state.pq); }
  if (state.tab === "jobs") { set("show", state.jshow); set("job", state.job); set("sec", state.sec); }
  const qs = p.toString();
  return "#/" + state.tab + (qs ? "?" + qs : "");
}
function applyHash(h) {
  const m = String(h || "").replace(/^#\/?/, "");
  if (!m) return;
  const [tab, qs] = m.split("?"); const p = new URLSearchParams(qs || ""); const g = (k) => p.get(k) || "";
  state.tab = tab; state.panel = "";
  if (tab === "purchases") { state.filters = { q: g("q"), job: g("job"), supplier: g("supplier"), month: g("month"), show: g("show") }; state.limit = 60; }
  if (tab === "inventory") { state.ishow = g("show"); state.iq = g("q"); }
  if (tab === "prices") { state.pshow = g("show"); state.pq = g("q"); state.limit = 60; }
  if (tab === "jobs") { state.jshow = g("show"); state.job = g("job"); state.sec = g("sec"); }
}
function navigate(hash) {
  applyHash(hash);
  try { history.pushState(null, "", hash); } catch {}
  render(); window.scrollTo(0, 0); afterNav();
}
function syncHash() { try { history.replaceState(null, "", hashFor()); } catch {} }
function afterNav() {
  const t = state.sec ? document.getElementById(state.sec) : state.tab === "jobs" && state.job ? $("tr.sel") : null;
  if (t) t.scrollIntoView({ block: "start" });
}

function render() {
  const admin = state.role === "admin";
  $("#who").hidden = $("#logout").hidden = $("#refresh").hidden = $("#nav").hidden = false;
  $("#who").textContent = `${state.name} · ${state.role}`; $("#who").className = "badge " + state.role;
  const D = state.D = derive();
  const tabs = [["overview", "Overview"], ["jobs", admin ? "Jobs & Budgets" : "Jobs"], ["purchases", "Purchases"], ["inventory", "Inventory"], ["prices", "Price History"]];
  if (!tabs.some((t) => t[0] === state.tab)) state.tab = "overview";
  $("#nav").innerHTML = `<div class="in">${tabs.map((t) => `<button type="button" data-go="#/${t[0]}" class="${state.tab === t[0] ? "on" : ""}" ${state.tab === t[0] ? 'aria-current="page"' : ""}>${t[1]}</button>`).join("")}</div>`;
  let html = "";
  if (state.tab === "overview") html = overviewPage(D);
  if (state.tab === "jobs") html = admin ? jobsAdminPage(D) : jobsStaffPage(D);
  if (state.tab === "purchases") html = purchasesPage(D);
  if (state.tab === "inventory") html = inventoryPage(D);
  if (state.tab === "prices") html = pricesPage(D);
  $("#app").innerHTML = html;
  syncHash();
  wire();
}

// ---------- overview ----------
function attentionItems(D) {
  const admin = state.role === "admin", out = [];
  const add = (lv, text, sub, label, go) => out.push({ lv, text, sub, label, go });
  if (admin) {
    const withB = D.J.filter((j) => Number(j.materials_budget || 0));
    const over = withB.filter((j) => budgetState(j).key === "over"), near = withB.filter((j) => budgetState(j).key === "near");
    const none = D.J.filter((j) => !Number(j.materials_budget || 0));
    const one = (arr) => arr.length === 1 ? "#/jobs?job=" + encodeURIComponent(arr[0].job) : "";
    if (over.length) add("urgent", `${plural(over.length, "job is", "jobs are")} over the materials budget`, over.map((j) => `${esc(jobTitle(j.job).main)}: ${esc(budgetLine(j))}`).join("<br>"), over.length === 1 ? "Review job" : "Review jobs", one(over) || "#/jobs?show=over");
    if (near.length) add("review", `${plural(near.length, "job is", "jobs are")} near the materials budget (85% or more used)`, near.map((j) => `${esc(jobTitle(j.job).main)} · ${esc(j.job)}: ${esc(budgetLine(j))}`).join("<br>"), near.length === 1 ? "Review job" : "Review jobs", one(near) || "#/jobs?show=near");
    if (none.length) add("review", `${plural(none.length, "tracked job needs", "tracked jobs need")} a budget`, none.map((j) => esc(jobTitle(j.job).main)).join(" · "), "Set budgets", "#/jobs?show=none");
  }
  if (D.need.length) add("review", `${plural(D.need.length, "purchase needs", "purchases need")} a job assigned`, `${(() => { const t = D.need.reduce((a, p) => a + Number(p.total || 0), 0), r = D.need.filter(isReturn).length; return r === D.need.length ? `${D.need.length === 1 ? "It is a return/credit" : "All are returns/credits"} (${money(-t)} credit), so they lower job spending once assigned.` : `${money(t)} in total${r ? `, including ${plural(r, "return/credit", "returns/credits")}` : ""}.`; })()} Not counted here: ${plural(D.stockPO.length, "stock order")} (PO marked shop, stock, truck stock, testing or Paula) and ${plural(D.qbOnly.length, "QuickBooks card charge")} with no ticket on file.`, "Review purchases", "#/purchases?show=needs");
  const lowC = D.inv.filter((x) => x.st.key === "low" || x.st.key === "zero");
  if (lowC.length) add("urgent", `${plural(lowC.length, "item is", "items are")} low or out of stock (confirmed count)`, lowC.slice(0, 4).map((x) => esc(x.i.item)).join(" · ") + (lowC.length > 4 ? " ..." : ""), "View low stock", "#/inventory?show=low");
  const nc = D.inv.filter((x) => x.st.key === "notcounted");
  if (nc.length) {
    const noMin = D.inv.filter((x) => x.i.min_level === "" || x.i.min_level == null).length;
    add("review", `${plural(nc.length, "inventory item needs", "inventory items need")} a count`, `No confirmed count yet, so their stock level is unknown.${noMin ? ` Reorder level is not set on ${plural(noMin, "item")}.` : ""}`, "Count items", "#/inventory?show=notcounted");
  }
  if (admin && D.rises60.length) add("review", `${plural(D.rises60.length, "part", "parts")} went up 10% or more since the previous buy (bought in the last 60 days)`, D.rises60.slice(0, 3).map((h) => `${esc(h.description)} +${esc(h.change_pct)}%`).join(" · "), "Review prices", "#/prices?show=rises60");
  if (D.dups.length) add("review", `${plural(D.dups.length, "set", "sets")} of job names look like the same job typed differently`, D.dups.slice(0, 2).map((g) => g.map(esc).join(" / ")).join("<br>"), "Review job names", "#/jobs?sec=dups");
  return out;
}

function overviewPage(D) {
  const admin = state.role === "admin";
  const items = attentionItems(D);
  const att = `<div class="card"><h3>Needs your attention</h3>${items.length ? `<ul class="att">${items.map((x) => `<li class="lv-${x.lv}"><div class="main">${st(x.lv, lvWord[x.lv])}<div><div class="t">${esc(x.text)}</div>${x.sub ? `<div class="s">${x.sub}</div>` : ""}</div></div><button type="button" class="${x.lv === "urgent" ? "primary" : "ghost"}" data-go="${esc(x.go)}">${esc(x.label)}</button></li>`).join("")}</ul>` : `<p class="muted">Nothing needs attention right now.</p>`}</div>`;
  const cards = [monthCard(D)]; if (admin) cards.push(budgetCard(D)); cards.push(inventoryCard(D), priceCard(D));

function monthCard(D) {
  const k = D.thisMonth, s = D.months[k] || { buy: 0, ret: 0, nb: 0, nr: 0 }, net = s.buy + s.ret;
  const prevK = ym(daysAgo(Number(todayPT().slice(8, 10)))), ps = D.months[prevK];
  const netTxt = net < 0 ? `${money(-net)} credit` : money(net);
  const why = net < 0 ? `<div class="explain">Returns (${money(-s.ret)}) were larger than new purchases (${money(s.buy)}) this month, so net spending is a ${money(-net)} credit.</div>` : "";
  return `<div class="card"><h3>${esc(fmtMonth(k))} <span class="muted small">(month to date)</span></h3>
    <div class="kv">
      <div>Purchases <span class="sub">${plural(s.nb, "purchase")}</span></div><div class="v">${money(s.buy)}</div>
      <div>Returns / credits <span class="sub">${plural(s.nr, "return/credit", "returns/credits")}</span></div><div class="v">${s.ret ? "&minus;" + money(-s.ret) : money(0)}</div>
      <div class="total"><b>Net spending</b></div><div class="v total big">${esc(netTxt)}</div>
    </div>${why}
    ${ps ? `<p class="note">${esc(fmtMonth(prevK))}: net ${esc(ps.buy + ps.ret < 0 ? money(-(ps.buy + ps.ret)) + " credit" : money(ps.buy + ps.ret))} (${plural(ps.nb, "purchase")}, ${plural(ps.nr, "return/credit", "returns/credits")}).</p>` : ""}
    <div class="foot"><button type="button" class="ghost" data-go="#/purchases?month=${esc(k)}">View this month's purchases</button></div></div>`;

function budgetCard(D) {

    ${none ? `<p class="note">${plural(none, "tracked job has", "tracked jobs have")} no budget set.</p>` : ""}
    <div class="foot"><button type="button" class="ghost" data-go="#/jobs">Open Jobs &amp; Budgets</button></div></div>`;
}

function inventoryCard(D) {

function priceCard(D) {

    <div class="foot"><button type="button" class="ghost" data-go="#/prices${r.length ? "?show=rises60" : ""}">Open Price History</button></div></div>`;

function chartCard(D) {
  const all = Object.keys(D.months).sort();
  if (!all.length) return "";
  const keys = all.slice(-12).reverse(), older = all.slice(0, -12).reverse();
  const net = (k) => D.months[k].buy + D.months[k].ret;
  const max = Math.max(...all.map((k) => Math.abs(net(k))), 1);
  const years = {}; all.forEach((k) => { years[k.slice(0, 4)] = (years[k.slice(0, 4)] || 0) + net(k); });
  const row = (k) => { const n = net(k), s = D.months[k]; return `<div class="m">${esc(fmtMon(k))}</div><div class="b" title="${esc(fmtMonth(k))}"><i class="${n < 0 ? "cr" : ""}" style="width:${Math.max(1, Math.round((Math.abs(n) / max) * 100))}%"></i></div><div class="n">${n < 0 ? esc(money(-n)) + " credit" : esc(money(n))}</div>${s.nr ? `<div class="x">bought ${esc(money(s.buy))} · returned ${esc(money(-s.ret))}</div>` : ""}`; };
  return `<div class="card"><h3>Net spending by month</h3>
    <p class="note" style="margin:0 0 10px">Net = purchases minus returns/credits. Year totals (net): ${Object.entries(years).map(([y, v]) => `${esc(y)}: ${esc(money(v))}`).join(" · ")}</p>
    <div class="mrows">${keys.map(row).join("")}</div>
    ${older.length ? `<details class="mt"><summary>Earlier months (${older.length})</summary><div class="mrows mt">${older.map(row).join("")}</div></details>` : ""}
    <p class="note">All Five Star purchases, including ship tickets from email and card charges from QuickBooks that have no ticket on file. A blue bar is a month where returns were larger than purchases.</p></div>`;
}

    <div class="wrap"><table class="mini"><thead><tr><th>Date</th><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Ext</th></tr></thead><tbody>${bRows || `<tr><td colspan="5" class="muted">No line items for this job yet.</td></tr>`}</tbody></table></div>

function jobForm() {

function comboHTML(id, label, value, placeholder) {
  return `<div class="combo" data-combo="${id}"><label for="${id}">${esc(label)}</label><input id="${id}" class="combo-in" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" placeholder="${esc(placeholder)}" value="${esc(value)}"><div class="combo-list" role="listbox" hidden></div></div>`;
}
function wireCombo(root, cfg) {
  if (!root || root.dataset.wired) return; root.dataset.wired = "1";
  const inp = $(".combo-in", root), list = $(".combo-list", root);
  let items = [];
  const show = () => {
    const raw = inp.value.trim(), q = raw.toLowerCase();
    const opts = jobOptions().filter((o) => !q || o.hay.includes(q));
    items = [];
    if (cfg.all) items.push({ val: "", title: "All jobs", sub: "no job filter", kind: "all" });
    if (cfg.none) items.push({ val: "", title: cfg.none, sub: "no job", kind: "none" });
    if (cfg.stock && !opts.some((o) => o.val.toLowerCase() === "stock") && (!q || "stock".includes(q))) items.push({ val: "stock", title: "stock", sub: "shop or truck stock, not a customer job", kind: "stock" });
    items.push(...opts.slice(0, 40));
    if (cfg.newjob && raw && !opts.some((o) => o.val.toLowerCase() === q) && q !== "stock") items.push({ val: raw, title: `Use "${raw}" as a new job name`, sub: "for a job that is not on the list yet", kind: "new" });
    list.innerHTML = items.map((o, i) => `<button type="button" class="combo-opt" role="option" data-i="${i}"><b>${esc(o.title)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</button>`).join("")
      + (opts.length > 40 ? `<div class="combo-more">${opts.length - 40} more. Keep typing to narrow the list.</div>` : "")
      + (!items.length ? `<div class="combo-more">No job matches "${esc(raw)}".</div>` : "");
    list.hidden = false; inp.setAttribute("aria-expanded", "true");
  };
  const hide = () => { list.hidden = true; inp.setAttribute("aria-expanded", "false"); };
  const pick = (o) => { hide(); cfg.onPick(o, inp); };
  inp.addEventListener("focus", show); inp.addEventListener("input", show);
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Escape") hide();
    else if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) show(); const b = $(".combo-opt", list); if (b) b.focus(); }
    else if (e.key === "Enter") {
      e.preventDefault(); const q = inp.value.trim().toLowerCase();
      if (!q) { const a = items.find((o) => o.kind === "all" || o.kind === "none"); if (a) pick(a); return; }
      const o = items.find((x) => x.kind !== "all" && x.kind !== "none" && x.val.toLowerCase() === q) || items.find((x) => x.kind === "job") || items.find((x) => x.kind === "new" || x.kind === "stock");
      if (o) pick(o);
    }
  });
  list.addEventListener("mousedown", (e) => e.preventDefault());
  list.addEventListener("click", (e) => { const b = e.target.closest(".combo-opt"); if (b) pick(items[Number(b.dataset.i)]); });
  list.addEventListener("keydown", (e) => {
    const b = e.target.closest(".combo-opt"); if (!b) return;
    if (e.key === "ArrowDown") { e.preventDefault(); (b.nextElementSibling && b.nextElementSibling.matches(".combo-opt") ? b.nextElementSibling : b).focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); (b.previousElementSibling || inp).focus(); }
    else if (e.key === "Escape") { hide(); inp.focus(); }
  });
  root.addEventListener("focusout", () => setTimeout(() => { if (!root.contains(document.activeElement)) hide(); }, 120));
}

function parseLines(text) {
  return String(text || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
    const [q, part_no, description, up] = l.split("|").map((s) => (s || "").trim());
    const m = q.match(/^(-?[\d.]+)\s*([a-z]*)$/i) || [];
    return { qty: m[1] ? Number(m[1]) : 1, unit: m[2] || "ea", part_no, description, unit_price: up === "" || up == null ? "" : Number(String(up).replace(/[$,]/g, "")) };
  });
}

// ---------- inventory ----------
function inventoryPage(D) {
  const q = state.iq.toLowerCase(), show = state.ishow;
  const rows = D.inv.filter(({ i, st: s }) => {
    if (q && !(i.item + " " + i.part_no + " " + i.location).toLowerCase().includes(q)) return false;
    if (show === "low" && !(s.key === "low" || s.key === "zero")) return false;
    if (show === "notcounted" && s.key !== "notcounted") return false;
    if (show === "nomin" && !(i.min_level === "" || i.min_level == null)) return false;
    if (show === "counted" && s.key === "notcounted") return false;
    return true;
  }).sort((a, b) => { const r = (x) => ({ zero: 0, low: 1, notcounted: 2, nomin: 3, ok: 4 }[x.st.key]); return r(a) - r(b) || String(a.i.item).localeCompare(String(b.i.item)); });
  const body = rows.map(({ i, st: s, b }, n) => {
    const counted = isCounted(i), hasQty = i.qty_on_hand !== "" && i.qty_on_hand != null;
    const onHand = counted
      ? `<b>${esc(hasQty ? i.qty_on_hand : "?")} ${esc(i.unit)}</b><span class="sub">counted ${esc(fmtDate(i.last_counted))}${i.counted_by ? " by " + esc(i.counted_by) : ""}</span>`
      : `<span class="muted">Not counted</span>${hasQty ? `<span class="sub">Recorded: ${esc(i.qty_on_hand)} ${esc(i.unit)} (from a receipt, not a count)</span>` : ""}`;
    const min = i.min_level === "" || i.min_level == null ? `<span class="muted">Not set</span>` : `${esc(i.min_level)} ${esc(i.unit)}`;
    const bought = b ? `${esc(b.qty)} ${esc(b.unit || i.unit)} since ${esc(fmtMon(b.first))}<span class="sub">from ${plural(b.n, "purchase line")}, not a count</span>` : `<span class="muted">None found</span>`;
    const key = "inv" + n;
    return `<tr>
      <td data-label="Item"><b>${esc(i.item)}</b><span class="sub">${esc(i.part_no)}${i.location ? " · " + esc(i.location) : ""}</span></td>
      <td data-label="Status">${st(s.lv, s.label)}</td>
      <td data-label="On hand (confirmed count)">${onHand}</td>
      <td data-label="Reorder level">${min}</td>
      <td data-label="Bought (from purchases)">${bought}</td>
      <td data-label=""><button type="button" class="${counted ? "ghost" : "primary"}" data-toggle="${key}" data-focus="1">Update count</button></td>
    </tr>
    <tr class="detail" data-for="${key}" hidden><td colspan="6">
      <form class="form invrow" data-part="${esc(i.part_no)}" data-item="${esc(i.item)}">
        <div><label for="${key}-q">Counted quantity (${esc(i.unit || "ea")})</label><input id="${key}-q" class="combo-in-focus" name="qty_on_hand" type="number" step="1" min="0" value="${counted && hasQty ? esc(i.qty_on_hand) : ""}" placeholder="count it, then type it"></div>
        <div><label for="${key}-l">Location</label><input id="${key}-l" name="location" value="${esc(i.location)}"></div>
        <div><label for="${key}-m">Reorder level</label><input id="${key}-m" name="min_level" type="number" step="1" min="0" value="${esc(i.min_level)}" placeholder="not set"></div>
        <div class="full"><button class="primary">Save</button> <span class="err" data-msg></span></div>
      </form>
      ${i.notes ? `<p class="small muted">${esc(i.notes)}</p>` : ""}
    </td></tr>`;
  }).join("");
  const opts = [["", "All items"], ["low", "Low or out of stock (counted)"], ["notcounted", "Not counted"], ["counted", "Counted"], ["nomin", "Reorder level not set"]];
  return `<div class="pagehead"><h2>Inventory</h2><span class="sp"></span><button type="button" class="primary" data-panel="inv">Add item</button></div>
    ${state.panel === "inv" ? invForm() : ""}
    <div class="card"><div class="filters">
      <div class="wide"><label for="iq">Search item, part or location</label><input id="iq" type="search" value="${esc(state.iq)}" placeholder="e.g. nipple, shop"></div>
      <div><label for="ishow">Show</label><select id="ishow">${opts.map((o) => `<option value="${o[0]}" ${o[0] === show ? "selected" : ""}>${o[1]}</option>`).join("")}</select></div>
    </div><p class="note">${plural(rows.length, "item")} shown. <b>On hand</b> is only a confirmed count (with date and name). <b>Bought</b> adds up purchase lines for the same part number; it is not a count and ignores what was used. Low stock = a counted quantity at or below the reorder level.</p></div>
    <div class="card tablecard"><table class="stack"><thead><tr><th>Item</th><th>Status</th><th>On hand (confirmed count)</th><th>Reorder level</th><th>Bought (from purchases)</th><th></th></tr></thead>
    <tbody>${body || `<tr><td colspan="6" class="muted">No items match.</td></tr>`}</tbody></table></div>`;
}

function invForm() {
  return `<div class="card panel"><h3>Add an inventory item</h3>
    <form id="invf" class="form">
      <div class="full"><label for="if-item">Item</label><input id="if-item" name="item" required placeholder="1in black malleable plug"></div>
      <div><label for="if-part">Part #</label><input id="if-part" name="part_no"></div>
      <div><label for="if-unit">Unit</label><input id="if-unit" name="unit" value="ea"></div>
      <div><label for="if-qty">Counted quantity (leave blank if not counted)</label><input id="if-qty" name="qty_on_hand" type="number" step="1"></div>
      <div><label for="if-loc">Location</label><input id="if-loc" name="location" value="shop"></div>
      <div><label for="if-min">Reorder level</label><input id="if-min" name="min_level" type="number" step="1"></div>
      <div class="full"><label for="if-notes">Notes</label><input id="if-notes" name="notes"></div>
      <div class="full"><button class="primary">Add item</button> <button type="button" class="ghost" data-panel="">Cancel</button> <span id="inverr" class="err"></span></div>
    </form></div>`;
}

// ---------- wiring ----------
function wire() {
  const f = state.filters;
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el[ev] = fn; };
  const keepFocus = (sel, v) => { const el = $(sel); if (el) { el.focus(); try { el.setSelectionRange(v.length, v.length); } catch {} } };
  on("#fq", "oninput", (e) => { f.q = e.target.value; state.limit = 60; render(); keepFocus("#fq", f.q); });
  on("#fsup", "onchange", (e) => { f.supplier = e.target.value; state.limit = 60; render(); });
  on("#fmon", "onchange", (e) => { f.month = e.target.value; state.limit = 60; render(); });
  on("#fshow", "onchange", (e) => { f.show = e.target.value; state.limit = 60; render(); });
  on("#pq", "oninput", (e) => { state.pq = e.target.value; state.limit = 60; render(); keepFocus("#pq", state.pq); });
  on("#pshow", "onchange", (e) => { state.pshow = e.target.value; state.limit = 60; render(); });
  on("#iq", "oninput", (e) => { state.iq = e.target.value; render(); keepFocus("#iq", state.iq); });
  on("#ishow", "onchange", (e) => { state.ishow = e.target.value; render(); });
  on("#jshow", "onchange", (e) => { state.jshow = e.target.value; render(); });
  on("#more", "onclick", () => { state.limit += 60; render(); });
  // job filter selector
  wireCombo($('[data-combo="fjob"]'), { all: true, onPick: (o) => { f.job = o.val; state.limit = 60; render(); } });
  // add purchase: job selector
  wireCombo($('[data-combo="af-job"]'), { none: "No job yet", stock: true, newjob: true, onPick: (o, inp) => {
    $("#af-jobval").value = o.val; inp.value = o.val;
    $("#af-jobsel").textContent = o.kind === "none" ? "No job: it will show under Needs a job." : o.kind === "new" ? `New job name: ${o.val}` : `Selected: ${o.title}${o.sub ? " (" + o.sub + ")" : ""}`;
  } });
  const save = async (form, errEl, payload) => {
    const btn = form.querySelector("button.primary");
    if (btn) btn.disabled = true;
    errEl.textContent = "Saving...";
    try { await api(payload); state.panel = ""; await load(); }
    catch (err) { errEl.textContent = "Could not save: " + err.message; if (btn) btn.disabled = false; }
  };
  on("#addf", "onsubmit", async (e) => {
    e.preventDefault();
    const purchase = Object.fromEntries(new FormData(e.target).entries());
    if (!purchase.job) purchase.job = ($("#af-job") ? $("#af-job").value.trim() : "");
    const lines = parseLines(purchase.lines); delete purchase.lines;
    const norm = (s) => String(s ?? "").trim().toLowerCase();
    if (norm(purchase.invoice_no) && !e.target.dataset.dupOk && (state.data.purchases || []).some((p) => norm(p.supplier) === norm(purchase.supplier) && norm(p.invoice_no) === norm(purchase.invoice_no))) {
      e.target.dataset.dupOk = "1";
      $("#adderr").textContent = "This supplier and invoice number is already in the list. Press Save again to add it anyway.";
      return;
    }
    await save(e.target, $("#adderr"), { action: "add", purchase, lines });
  });
  on("#addf", "oninput", (e) => { delete e.currentTarget.dataset.dupOk; });
  on("#estf", "onsubmit", async (e) => {
    e.preventDefault();
    const item = Object.fromEntries(new FormData(e.target).entries());
    await save(e.target, $("#esterr"), { action: "addEstimateItem", item });
  });
  on("#invf", "onsubmit", async (e) => {
    e.preventDefault();
    const item = Object.fromEntries(new FormData(e.target).entries());
    await save(e.target, $("#inverr"), { action: "setInventory", item });
  });
  on("#jobf", "onsubmit", async (e) => {
    e.preventDefault();
    const job = Object.fromEntries(new FormData(e.target).entries());
    await save(e.target, $("#joberr"), { action: "upsertJob", job });
  });
  document.querySelectorAll("form.invrow").forEach((fm) => fm.onsubmit = async (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(fm).entries());
    const item = { item: fm.dataset.item, part_no: fm.dataset.part, qty_on_hand: v.qty_on_hand, location: v.location, min_level: v.min_level };
    await save(fm, $("[data-msg]", fm), { action: "setInventory", item });
  });
  document.querySelectorAll("form.setb").forEach((fm) => fm.onsubmit = async (e) => {
    e.preventDefault();
    const val = $("input", fm).value;
    await save(fm, $(".err", fm), { action: "upsertJob", job: { job: fm.dataset.job, materials_budget: val } });
  });
}

// assign a purchase (existing "assign" action), wired when its row opens
function wireAssign(box) {
  const root = $(".combo", box);
  wireCombo(root, { none: "Remove the job (no job)", stock: true, newjob: true, onPick: async (o, inp) => {
    const msg = $("[data-msg]", box);
    if (o.val === box.dataset.cur) { msg.textContent = "That is already the job on this purchase."; return; }
    inp.disabled = true; msg.textContent = "Saving...";
    try { await api({ action: "assign", id: box.dataset.id, job: o.val }); await load(); }
    catch (err) { inp.disabled = false; msg.textContent = "Could not assign: " + err.message; }
  } });
}

// one delegated click handler for links, toggles and panels
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); navigate(go.dataset.go); return; }
  const tg = e.target.closest("[data-toggle]");
  if (tg) {
    const row = document.querySelector(`tr.detail[data-for="${CSS.escape(tg.dataset.toggle)}"]`);
    if (!row) return;
    const opening = row.hidden || !!tg.dataset.focus;
    row.hidden = !opening;
    if (opening) {
      const box = $(".assignbox", row); if (box) wireAssign(box);
      if (tg.dataset.focus) { const inp = $(".assignbox .combo-in", row) || $("input[name=qty_on_hand]", row); if (inp) inp.focus(); }
    }
    return;
  }
  const pn = e.target.closest("[data-panel]");
  if (pn) { state.panel = state.panel === pn.dataset.panel ? "" : pn.dataset.panel; render(); if (state.panel) { const c = $(".panel"); if (c) { c.scrollIntoView({ block: "start" }); const i = $("input:not([type=hidden])", c); if (i) i.focus(); } } return; }
  const sb = e.target.closest("[data-setb]");
  if (sb) { const fm = sb.parentElement.nextElementSibling; sb.parentElement.hidden = true; fm.hidden = false; $("input", fm).focus(); return; }
  const cn = e.target.closest("form.setb [data-cancel]");
  if (cn) { const fm = cn.closest("form"); fm.hidden = true; fm.previousElementSibling.hidden = false; return; }
  const ej = e.target.closest("[data-editjob]");
  if (ej) {
    const j = (state.data.jobs || []).find((x) => String(x.job || "").trim() === ej.dataset.editjob) || {};
    state.panel = "job"; render();
    const jf = $("#jobf");
    ["job", "address", "customer", "quote_total", "materials_budget", "labor_days", "status", "notes"].forEach((k) => { if (jf.elements[k]) jf.elements[k].value = j[k] ?? ""; });
    jf.scrollIntoView({ block: "start" });
  }
});
window.addEventListener("popstate", () => { applyHash(location.hash || "#/overview"); if (state.data) render(); });

$("#refresh").onclick = load;
$("#logout").onclick = () => { try { sessionStorage.removeItem("mt_pc"); } catch {} state.passcode = ""; state.role = null; state.data = null; renderLogin(); };

(function boot() {
  try { state.name = localStorage.getItem("mt_name") || ""; state.passcode = sessionStorage.getItem("mt_pc") || ""; } catch {}
  if (location.hash) applyHash(location.hash);
  if (API_URL.startsWith("PASTE_")) { $("#app").innerHTML = `<div class="card"><b>Not connected yet.</b> The Apps Script URL has not been set in this page (see README).</div>`; return; }
  if (state.passcode && state.name) load().then(afterNav); else renderLogin();
})();
</script>
